name: Dockerfile Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run hadolint on active Dockerfiles
        run: |
          find . -name 'Dockerfile*' -not -path './.git/*' -not -path '*/obsolete/*' -print0 | \
            xargs -0 -n1 docker run --rm -i hadolint/hadolint hadolint --failure-threshold error -
