name: ProxySQL Image Test

on:
  push:
    branches: [main]
    paths:
      - 'proxysql-images/**'
      - '.github/workflows/proxysql-test.yml'
      - '.github/workflows/proxysql-refresh.yml'
  pull_request:
    paths:
      - 'proxysql-images/**'
      - '.github/workflows/proxysql-test.yml'
      - '.github/workflows/proxysql-refresh.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        dist: [debian, centos]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate runtime image release policy
        run: |
          python3 -m unittest discover -s proxysql-images/tests -v
          python3 proxysql-images/release_plan.py > /dev/null

      - name: Get maintained ProxySQL image version
        id: version
        run: |
          set -euo pipefail
          vers=$(jq -r '.releases[0].version' proxysql-images/releases.json)
          echo "vers=$vers" >> "$GITHUB_OUTPUT"

      - name: Build and test proxysql-${{ matrix.dist }}
        working-directory: proxysql-images
        run: |
          chmod +x test.sh
          VERS=${{ steps.version.outputs.vers }} DIST=${{ matrix.dist }} ./test.sh
